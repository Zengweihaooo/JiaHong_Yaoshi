name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JiaHong_Yaoshi
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: JiaHong_Yaoshi

      - name: Checkout JiaHong UI
        uses: actions/checkout@v6
        with:
          repository: Zengweihaooo/JiaHong-UI
          path: JiaHong_UI

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JiaHong_UI/package-lock.json
            JiaHong_Yaoshi/package-lock.json

      - name: Install JiaHong UI dependencies
        working-directory: JiaHong_UI
        run: npm ci

      - name: Build JiaHong UI
        working-directory: JiaHong_UI
        run: npm run build

      - name: Install pharmacist dependencies
        run: npm ci

      - name: Build pharmacist app
        run: npm run build:pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: JiaHong_Yaoshi/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
